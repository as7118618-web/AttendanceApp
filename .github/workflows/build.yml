name: Build Attendance App APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: Action-Android/action-buildozer@v1.4
        with:
          command: buildozer -v android debug
          subfolder: .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AttendanceApp-APK
          path: bin/*.apk
