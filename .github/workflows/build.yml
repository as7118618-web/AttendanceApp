name: Build Attendance App APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build APK with Buildozer
        run: |
          yes | buildozer --warn_on_root=0 -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AttendanceApp-APK
          path: bin/*.apk
